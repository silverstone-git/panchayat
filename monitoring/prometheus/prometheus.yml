global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['panchayat-postgres-exporter-1:9187']
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['panchayat-redis-exporter-1:9121']
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['panchayat-kafka-exporter-1:9308']
