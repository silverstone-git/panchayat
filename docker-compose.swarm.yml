services:
  gateway:
    image: panchayat-gateway:latest
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - USER_SERVICE_URI=http://user-service:8000
      - THREADS_SERVICE_URI=http://threads:8000
      - VOTING_SERVICE_URI=http://voting:8000
      - CROWDFUND_SERVICE_URI=http://crowdfund-service:8000
      - MODERATION_SERVICE_URI=http://moderation-service:8000
      - EXPERT_REVIEW_SERVICE_URI=http://expert-review-service:8000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - panchayat-network

  threads:
    image: panchayat-threads:latest
    build:
      context: ./threads
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=threads_db
      - REDIS_HOST=redis-cache
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MODERATION_SERVICE_URL=http://moderation-service:8000
      - POPULAR_VOTE_THRESHOLD=1
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_S3_API_BASE_URL_PANCHAYAT_PUBLIC=${R2_S3_API_BASE_URL_PANCHAYAT_PUBLIC}
      - R2_ACCESS_KEY_ID_PANCHAYAT_PUBLIC=${R2_ACCESS_KEY_ID_PANCHAYAT_PUBLIC}
      - R2_SECRET_ACCESS_KEY_PANCHAYAT_PUBLIC=${R2_SECRET_ACCESS_KEY_PANCHAYAT_PUBLIC}
      - R2_PUBLIC_DEVELOPMENT_URL_PANCHAYAT_PUBLIC=${R2_PUBLIC_DEVELOPMENT_URL_PANCHAYAT_PUBLIC}
    depends_on:
      - kafka
      - elasticsearch
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
    networks:
      - panchayat-network

  voting:
    image: panchayat-voting:latest
    build:
      context: ./voting
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=voting_db
      - REDIS_HOST=redis-cache
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - kafka
    deploy:
      replicas: 3
    networks:
      - panchayat-network

  user-service:
    image: panchayat-user-service:latest
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=users_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_S3_API_BASE_URL_PANCHAYAT_PUBLIC=${R2_S3_API_BASE_URL_PANCHAYAT_PUBLIC}
      - R2_ACCESS_KEY_ID_PANCHAYAT_PUBLIC=${R2_ACCESS_KEY_ID_PANCHAYAT_PUBLIC}
      - R2_SECRET_ACCESS_KEY_PANCHAYAT_PUBLIC=${R2_SECRET_ACCESS_KEY_PANCHAYAT_PUBLIC}
      - R2_S3_API_BASE_URL_PANCHAYAT_PRIVATE=${R2_S3_API_BASE_URL_PANCHAYAT}
      - R2_ACCESS_KEY_ID_PANCHAYAT_PRIVATE=${R2_ACCESS_KEY_ID_PANCHAYAT_PRIVATE}
      - R2_SECRET_ACCESS_KEY_PANCHAYAT_PRIVATE=${R2_SECRET_ACCESS_KEY_PANCHAYAT_PRIVATE}
    depends_on:
      - kafka
    deploy:
      replicas: 2
    networks:
      - panchayat-network

  moderation-service:
    image: panchayat-moderation:latest
    build:
      context: ./moderation-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=moderation_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - kafka
      - postgres-db
    deploy:
      replicas: 2
    networks:
      - panchayat-network

  expert-review-service:
    image: panchayat-expert-review:latest
    build:
      context: ./expert-review-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=expert_review_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - kafka
      - postgres-db
    deploy:
      replicas: 2
    networks:
      - panchayat-network

  notification-service:
    image: panchayat-notification:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=notification_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - kafka
      - postgres-db
    deploy:
      replicas: 1
    networks:
      - panchayat-network

  gov-submit-service:
    image: panchayat-gov-submit:latest
    build:
      context: ./gov-submit-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=gov_submit_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - kafka
      - postgres-db
    deploy:
      replicas: 1
    networks:
      - panchayat-network

  crowdfund-service:
    image: panchayat-crowdfund:latest
    build:
      context: ./crowdfund-service
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres-db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=crowdfund_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      - kafka
      - postgres-db
    deploy:
      replicas: 1
    networks:
      - panchayat-network

  client:
    image: panchayat-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - GATEWAY_URL=http://gateway:8080
      - THREADS_URL=http://threads:8000
      - VOTING_URL=http://voting:8000
    ports:
      - "5173:80"
    depends_on:
      - gateway
    deploy:
      replicas: 1
    networks:
      - panchayat-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"
    networks:
      - panchayat-network

  postgres-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=panchayat_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      placement:
        constraints: [node.role == manager]
    networks:
      - panchayat-network

  redis-cache:
    image: redis:alpine
    networks:
      - panchayat-network

  elasticsearch:
    image: elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=false
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - panchayat-network

  kafka:
    image: apache/kafka:4.1.2
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CREATE_TOPICS: "ideas-events:1:1,votes-events:1:1,xp-events:1:1,content.hidden:1:1,moderation.reports:1:1,dead-letter-queue:1:1,expert-events:1:1"
    ports:
      - "9092:9092"
    networks:
      - panchayat-network

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - panchayat-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - panchayat-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-db:5432/threads_db?sslmode=disable
    networks:
      - panchayat-network

  redis-exporter:
    image: oliver006/redis_exporter
    environment:
      - REDIS_ADDR=redis-cache:6379
    networks:
      - panchayat-network

  kafka-exporter:
    image: danielqsj/kafka-exporter
    command: ["--kafka.server=kafka:29092"]
    networks:
      - panchayat-network

networks:
  panchayat-network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
